<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="HYBRD — train, track and fuel like a hybrid athlete." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HYBRD" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <script>
      /* Apply the saved theme before first paint (no flash). Keep in sync with src/lib/theme.ts. */
      (function () {
        try {
          var p = localStorage.getItem('hybrd:theme');
          var dark = p === 'dark' || ((p !== 'light') && !(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches === false));
          var t = dark ? 'dark' : 'light', d = document.documentElement;
          d.setAttribute('data-theme', t); d.style.colorScheme = t;
          var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', dark ? '#0a0a0a' : '#f4f4f1');
          var sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]'); if (sb && !dark) sb.setAttribute('content', 'default');
        } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
      })();
    </script>
    <title>HYBRD — Hybrid Athlete Training</title>
    <script src="%BASE_URL%config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
